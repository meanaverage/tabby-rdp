name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit, their tag in the comment: a tag can be moved to other code, a commit can't
# (CONTRIBUTING.md, "Actions").

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - run: npm ci
      - name: Audit all locked dependencies, including build and QA tools
        run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run build:helpers
      - name: Network helper checks
        run: |
          test -z "$(gofmt -l helper)"
          go -C helper vet ./...
          go -C helper test -race ./...
      - name: Type check the tests
        run: npm run typecheck:test
      - name: Unit tests
        # Among them: vendor/ and the IronRDP patch series are what vendor/SHA256SUMS records (test/unit/vendor.ts).
        # ironrdp.yml rebuilds vendor/ when they change.
        run: npm run test:unit
      - name: QA dashboard contracts and lifecycle
        run: npm run test:qa
      - name: Package contents
        run: |
          node scripts/pack.mjs --dry-run 2>&1 | tee pack.txt
          # The plugin's package, apart from the platforms' FreeRDP packages after it ("# <name>@<version>" each).
          awk '/^# / { plugin = ($2 ~ /^tabby-rdp@/) } plugin' pack.txt > plugin.txt
          grep -q 'dist/index.js' plugin.txt
          grep -q 'vendor/iron-remote-desktop-rdp.js' plugin.txt
          grep -q 'vendor/ironrdp_web_bg.wasm' plugin.txt
          grep -q 'remote/trd-pty.py' plugin.txt
          grep -q 'bin/SHA256SUMS' plugin.txt
          for platform in darwin-arm64 darwin-x64 linux-arm linux-arm64 linux-x64; do grep -q "bin/$platform/tabby-rdp-proxy" plugin.txt; done
          for platform in win32-arm64 win32-x64; do grep -q "bin/$platform/tabby-rdp-proxy.exe" plugin.txt; done
          # No shrinkwrap: package.json pins the runtime dependencies exactly (scripts/package-metadata.mjs).
          if grep -qE ' (npm-shrinkwrap|package-lock)\.json' plugin.txt; then exit 1; fi
          if grep -qE ' (src|test|testbed|ironrdp)/' plugin.txt; then exit 1; fi
          # The troubleshooting page links this one packaged guide; other documentation stays out.
          awk '/ docs\// && !/ docs\/desk\.md[[:space:]]*$/ { bad = 1 } END { exit bad }' plugin.txt
          # No native code in the plugin's package: the FreeRDP helper is in a package per platform.
          if grep -q ' native/bin/' plugin.txt; then exit 1; fi
          for platform in $(node -p "require('./package.json').tabbyRdp.freerdpPlatforms.join(' ')"); do
            awk -v name="@tabby-rdp/freerdp-$platform@" '/^# / { this = (index($2, name) == 1) } this' pack.txt | grep -qE '^ tabby-freerdp(\.exe)?$'
          done
      - name: The packages hold the commit's files
        # The check publish.yml makes before it stages a release, here on every change, so that nothing trips it
        # first at a release: in the plugin's, vendor/ as the commit's vendor/SHA256SUMS lists it and every file outside
        # dist/ as committed; in each FreeRDP package, native/bin/<platform> as committed (scripts/check-vendor.mjs).
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          node scripts/pack.mjs --pack-destination "$RUNNER_TEMP/package"
          for package in "$RUNNER_TEMP"/package/*.tgz; do
            node scripts/check-vendor.mjs package "$package" HEAD
          done
      - name: Plugin build for PR testing
        # The plugin's package and every platform's FreeRDP package: install the plugin's together with the one for
        # the computer (CONTRIBUTING.md, "Releasing").
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabby-rdp-test-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: No inlined assets in vendor/
        # The WebAssembly ships as its own file (scripts/build-ironrdp.sh), not as a base64 data URL in the bundle.
        run: "! grep -l ';base64,' vendor/*.js"

  electron:
    name: Unit tests in Electron
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run build:helper
      - name: Electron
        # Test a patched standalone Electron; Native Tabby QA also checks the host's bundled runtime.
        # The separate manifest and lock pin the complete download toolchain.
        run: |
          mkdir -p "$RUNNER_TEMP/electron"
          cp scripts/electron/package.json scripts/electron/package-lock.json "$RUNNER_TEMP/electron/"
          cd "$RUNNER_TEMP/electron"
          npm ci --ignore-scripts --no-audit --no-fund
          # Run only the locked Electron installer explicitly; other dependencies' lifecycle scripts stay disabled.
          # This fetches Electron's versioned binary and verifies its upstream checksum before use.
          node node_modules/electron/install.js
          electron="$(node -p "require('electron')")"
          test -x "$electron"
          echo "TRD_ELECTRON=$electron" >> "$GITHUB_ENV"
      - name: Unit tests, with those that run in Electron
        run: npm run test:unit

  trd-pty:
    name: trd-pty
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test/unit/trd-pty.py remote/trd-pty.py
      - run: python3 testbed/test_images.py
      - run: python3 testbed/test_credentials.py

  ironrdp-patches:
    name: IronRDP patches apply
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the series to the base commit
        run: |
          git init -q ironrdp-src
          cd ironrdp-src
          git fetch -q --depth 1 https://github.com/Devolutions/IronRDP.git "$(cat ../ironrdp/BASE_COMMIT)"
          git checkout -q FETCH_HEAD
          for patch in ../ironrdp/patches/*.patch; do
            echo "applying $(basename "$patch")"
            git apply --whitespace=nowarn "$patch"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The web component's tests, patches included
        working-directory: ironrdp-src/web-client/iron-remote-desktop
        run: |
          npm ci --no-audit --no-fund
          npx vitest run

  names:
    name: No internal names
    # Never inject private patterns into a pull request or an unprotected branch run.
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The maintainers' private host and domain names, one extended regex per line, in the repository secret
      # INTERNAL_NAMES (not in the repository, where they would be what it keeps out). The job runs only after a
      # push to a protected branch; pull requests and unprotected branch pushes never receive this secret.
      - name: Check
        env:
          INTERNAL_NAMES: ${{ secrets.INTERNAL_NAMES }}
        run: |
          if [ -z "$INTERNAL_NAMES" ]; then echo "INTERNAL_NAMES is not set: skipped"; exit 0; fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/names" "$RUNNER_TEMP/hits"' EXIT
          printf '%s\n' "$INTERNAL_NAMES" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/names"
          # vendor/ is IronRDP's build: its base64 data matches short names by chance.
          if git ls-files -z | grep -zv '^vendor/' | xargs -0 grep -n -I -i -E -f "$RUNNER_TEMP/names" > "$RUNNER_TEMP/hits"; then
            echo "Internal names found (the matching lines are not shown here):"
            cut -d: -f1,2 "$RUNNER_TEMP/hits"
            exit 1
          fi
