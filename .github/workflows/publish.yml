name: Publish

# Stages a release on npm, with provenance, when a version tag (v1.2.3) is pushed (a maintainer then approves it on
# npmjs.com (Staged Packages) or with `npm stage approve <id>`, with two-factor authentication, before it goes live),
# and prepares a GitHub draft from its CHANGELOG.md section. Publish the draft only after npm approval and verification.
# Stable X.Y.Z uses npm latest; beta.N and rc.N use beta. Both channels retain the same approval and build gates.
# Authenticates by npm trusted publishing (OIDC, no token); see CONTRIBUTING.md for the one-time setup on npmjs.com.
#
# vendor/ (IronRDP's build) is committed and published as it is in the tagged commit, once ironrdp.yml has rebuilt it
# from IronRDP and the patch series and found it identical; otherwise the package isn't staged, nor the release created.
# The package is built and packed in a job of its own, which reports its SHA-256. The job that can publish runs none of
# the dependencies' code: it takes the package by that hash (any job of the run can replace an artifact, and the
# IronRDP jobs run a great deal of others' code), checks that it holds the tagged commit's files
# (scripts/check-vendor.mjs: vendor/ against the commit's vendor/SHA256SUMS, not the package's own copy, and every other
# committed file in it), and stages that very file. dist/ is as the package job built it: only a maintainer's own build
# (`--same-as`, CONTRIBUTING.md) checks it before the staged package is approved.
#
# Actions are pinned to a commit, their tag in the comment: a tag can be moved to other code, a commit can't
# (CONTRIBUTING.md, "Actions").

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ironrdp:
    name: IronRDP
    uses: ./.github/workflows/ironrdp.yml

  package:
    name: Package
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate release version and compatibility policy
        run: node scripts/release-plan.mjs check
      # No install scripts: the build is tsc.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The package's hash, for the publish job to take it by (below). Without a package of the tag's version, no hash,
      # and nothing is staged.
      - id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          sum=$(sha256sum "$RUNNER_TEMP/package/tabby-rdp-${GITHUB_REF_NAME#v}.tgz" | cut -c1-64)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [ironrdp, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # the OIDC token for trusted publishing and provenance, in this job only
    steps:
      # The tagged commit, to check the package against, and scripts/check-vendor.mjs (Node.js and git only).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js 26.8.2 exactly, for the npm that comes with it, 11.19.1: staged publishing needs npm 11.15.0 or later
      # (trusted publishing 11.5.1), and Node 22's is npm 10. This npm publishes with the job's identity, so it comes
      # inside Node.js's own download, which runs everything here anyway, not as a second download from the registry;
      # and a newer one comes in by a change here, not by its release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          registry-url: https://registry.npmjs.org
      - run: node -e "const [a, b] = process.argv[1].split('.').map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error('npm ' + process.argv[1] + ' cannot stage a publish'); process.exit(1) }" "$(npm --version)"
      - name: Validate release version and compatibility policy
        run: node scripts/release-plan.mjs check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Any job of this run can replace an artifact by its name (the IronRDP jobs too, which run build scripts and tests
      # of a great many crates and packages): the package is taken by the hash the package job reported, or not at all.
      - name: The package is the one the package job made
        env:
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          echo "$SHA256" | grep -qxE '[0-9a-f]{64}'
          echo "$SHA256  $RUNNER_TEMP/package/tabby-rdp-${GITHUB_REF_NAME#v}.tgz" | sha256sum --strict -c -
      - name: The package holds the tagged commit's files
        run: node scripts/check-vendor.mjs package "$RUNNER_TEMP/package/tabby-rdp-${GITHUB_REF_NAME#v}.tgz" HEAD
      # Staged, not live: the trusted publisher is allowed to stage only (npm's recommended setting). The file just
      # checked, as it is: publishing a tarball runs none of the package's scripts.
      - run: |
          npm_tag=$(node scripts/release-plan.mjs npm-tag)
          npm stage publish "$RUNNER_TEMP/package/tabby-rdp-${GITHUB_REF_NAME#v}.tgz" --tag "$npm_tag" --provenance --access public --ignore-scripts

  release:
    name: GitHub draft from the changelog
    # Staging is not availability. Keep the draft until npm approval and a registry check.
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # creates a draft for the existing tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes
        run: node scripts/release-plan.mjs notes > notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(node scripts/release-plan.mjs npm-tag)" = beta ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --draft --prerelease --latest=false --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --draft --latest=false --notes-file notes.md
          fi
