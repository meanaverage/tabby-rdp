name: Publish

# Stages a release on npm, with provenance, when a version tag (v1.2.3) is pushed (a maintainer then approves it on
# npmjs.com (Staged Packages) or with `npm stage approve <id>`, with two-factor authentication, before it goes live),
# and prepares a GitHub draft from its CHANGELOG.md section. Publish the draft only after npm approval and verification.
# Stable X.Y.Z uses npm latest; beta.N and rc.N use beta. Both channels retain the same approval and build gates.
# Authenticates by npm trusted publishing (OIDC, no token); see CONTRIBUTING.md for the one-time setup on npmjs.com.
#
# vendor/ (IronRDP's build) is committed and published as it is in the tagged commit, once ironrdp.yml has rebuilt it
# from IronRDP and the patch series and found it identical; otherwise the package isn't staged, nor the release created.
# The package is built and packed in a job of its own, which reports its SHA-256. The job that can publish runs none of
# the dependencies' code: it takes the package by that hash (any job of the run can replace an artifact, and the
# IronRDP jobs run a great deal of others' code), checks that it holds the tagged commit's files
# (scripts/check-vendor.mjs: vendor/ against the commit's vendor/SHA256SUMS, not the package's own copy, and every other
# committed file in it, with the two metadata files projected to runtime-only form), and stages that very file. dist/ is as the package job built it: only a maintainer's own build
# (`--same-as`, CONTRIBUTING.md) checks it before the staged package is approved.
#
# The FreeRDP helper is published in a package per platform (@tabby-rdp/freerdp-<platform>, from native/bin as committed),
# which the plugin's package.json names as optional dependencies. They go the same way, each taken by its hash and
# checked against the tag, and are staged before the plugin: approve them first. A new one's first version is published
# by hand (npm's trusted publishing needs the package to exist; CONTRIBUTING.md), and is checked here rather than staged.
#
# Actions are pinned to a commit, their tag in the comment: a tag can be moved to other code, a commit can't
# (CONTRIBUTING.md, "Actions").

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ironrdp:
    name: IronRDP
    uses: ./.github/workflows/ironrdp.yml

  package:
    name: Package
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: Validate release version and compatibility policy
        run: node scripts/release-plan.mjs check
      # No install scripts: the build is tsc.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:helpers
      # The packages' hashes (the plugin's and the FreeRDP packages'), for the publish job to take them by (below).
      # Without the packages of the tag's version, it finds other files than it expects, and nothing is staged.
      - id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          node scripts/pack.mjs --pack-destination "$RUNNER_TEMP/package"
          {
            echo 'sums<<SUMS'
            (cd "$RUNNER_TEMP/package" && sha256sum -- *.tgz)
            echo SUMS
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  helpers:
    name: Network helpers rebuilt independently
    runs-on: macos-15
    outputs:
      sha256: ${{ steps.sums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - id: sums
        run: |
          npm run build:helpers
          echo "sha256=$(shasum -a 256 bin/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: [ironrdp, package, helpers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # the OIDC token for trusted publishing and provenance, in this job only
    steps:
      # The tagged commit, to check the package against, and scripts/check-vendor.mjs (Node.js and git only).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js 26.8.2 exactly, for the npm that comes with it, 11.19.1: staged publishing needs npm 11.15.0 or later
      # (trusted publishing 11.5.1), and Node 22's is npm 10. This npm publishes with the job's identity, so it comes
      # inside Node.js's own download, which runs everything here anyway, not as a second download from the registry;
      # and a newer one comes in by a change here, not by its release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          registry-url: https://registry.npmjs.org
      - run: node -e "const [a, b] = process.argv[1].split('.').map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error('npm ' + process.argv[1] + ' cannot stage a publish'); process.exit(1) }" "$(npm --version)"
      - name: Validate release version and compatibility policy
        run: node scripts/release-plan.mjs check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Any job of this run can replace an artifact by its name (the IronRDP jobs too, which run build scripts and tests
      # of a great many crates and packages): each package is taken by the hash the package job reported, or not at all,
      # and the hashes are of exactly the packages the tag's package.json makes (scripts/release-plan.mjs).
      - name: The packages are the ones the package job made
        env:
          SUMS: ${{ needs.package.outputs.sums }}
        run: |
          node scripts/release-plan.mjs packages | cut -f2 | sort > "$RUNNER_TEMP/expected"
          printf '%s\n' "$SUMS" | grep -xE '[0-9a-f]{64}  [A-Za-z0-9._-]+\.tgz' | cut -c67- | sort > "$RUNNER_TEMP/listed"
          [ "$(printf '%s\n' "$SUMS" | wc -l)" -eq "$(wc -l < "$RUNNER_TEMP/listed")" ]
          diff "$RUNNER_TEMP/expected" "$RUNNER_TEMP/listed"
          cd "$RUNNER_TEMP/package" && printf '%s\n' "$SUMS" | sha256sum --strict -c -
      - name: The packages hold the tagged commit's files
        # The list by assignment, which stops the step if the script fails (a process substitution wouldn't).
        env:
          HELPERS: ${{ needs.helpers.outputs.sha256 }}
        run: |
          echo "$HELPERS" | grep -qxE '[0-9a-f]{64}'
          node scripts/check-vendor.mjs package "$RUNNER_TEMP/package/tabby-rdp-${GITHUB_REF_NAME#v}.tgz" HEAD --helpers-sha256 "$HELPERS"
          list=$(node scripts/release-plan.mjs packages)
          [ -n "$list" ]
          mapfile -t packages <<< "$list"
          for package in "${packages[@]}"; do
            node scripts/check-vendor.mjs package "$RUNNER_TEMP/package/${package#*$'\t'}" HEAD
          done
      # Staged, not live: the trusted publisher is allowed to stage only (npm's recommended setting). The files just
      # checked, as they are: publishing a tarball runs none of the package's scripts. The FreeRDP packages first, then
      # the plugin, which names them: a failure leaves the plugin unstaged.
      - run: |
          npm_tag=$(node scripts/release-plan.mjs npm-tag)
          version=${GITHUB_REF_NAME#v}
          list=$(node scripts/release-plan.mjs packages)
          [ -n "$list" ]
          mapfile -t packages <<< "$list"
          for package in "${packages[@]}"; do
            name=${package%%$'\t'*} file=${package#*$'\t'}
            if [ "$name" != tabby-rdp ] && [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              # A new package's first version is published by hand (CONTRIBUTING.md): checked against the tag, not staged.
              mkdir -p "$RUNNER_TEMP/published"
              published=$(npm pack "$name@$version" --ignore-scripts --pack-destination "$RUNNER_TEMP/published" | tail -n 1)
              node scripts/check-vendor.mjs package "$RUNNER_TEMP/published/$published" HEAD
              continue
            fi
            npm stage publish "$RUNNER_TEMP/package/$file" --tag "$npm_tag" --provenance --access public --ignore-scripts
          done

  release:
    name: GitHub draft from the changelog
    # Staging is not availability. Keep the draft until npm approval and a registry check.
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # creates a draft for the existing tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes
        run: node scripts/release-plan.mjs notes > notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(node scripts/release-plan.mjs npm-tag)" = beta ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --draft --prerelease --latest=false --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --draft --latest=false --notes-file notes.md
          fi
