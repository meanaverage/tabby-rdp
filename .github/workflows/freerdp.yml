name: FreeRDP native builds

on:
  push:
    branches: [main]
    paths:
      - 'native/*.c'
      - 'native/*.cmake'
      - 'native/CMakeLists.txt'
      - 'native/*-source.json'
      - 'scripts/build-freerdp*.mjs'
      - '.github/workflows/freerdp.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'native/*.c'
      - 'native/*.cmake'
      - 'native/CMakeLists.txt'
      - 'native/*-source.json'
      - 'scripts/build-freerdp*.mjs'
      - '.github/workflows/freerdp.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freerdp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config patchelf zlib1g-dev perl
      - name: Build pinned OpenSSL and FreeRDP
        id: build
        run: |
          node -e "require('fs').rmSync('native/bin',{recursive:true,force:true})"
          node scripts/build-freerdp-ci.mjs
      - name: Native protocol and security checks
        env:
          TRD_SINGLE_NATIVE_BUILD: '1'
        run: |
          npm ci --ignore-scripts
          npm run build
          node --import tsx --test test/unit/freerdp.ts
      - name: Stage the public native bundle
        if: always() && steps.build.outcome == 'success'
        run: node -e "const f=require('fs'),p=require('path'),name='freerdp-'+process.platform+'-'+process.arch+'.tgz';f.mkdirSync('native-artifacts',{recursive:true});f.copyFileSync(p.join('.qa',name),p.join('native-artifacts',name))"
      - name: Retain native bundle with source records and licenses
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freerdp-${{ runner.os }}-${{ runner.arch }}
          path: native-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
