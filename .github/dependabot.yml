# Version updates target the active development branch. Update target-branch when that branch advances (AGENTS.md).
# GitHub reads this configuration from the repository's default branch; security updates always target that branch.
# scripts/electron is an additional, pinned QA runtime; review upgrades alongside native Tabby host checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: 0.6.2
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: 0.6.2
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
